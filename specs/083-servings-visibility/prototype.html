['mouseover', 'focusin'].forEach(ev => document.addEventListener(ev, (e) => { const t = e.target.closest?.('#view .k-tip'); if (t) fitTip(t); }));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (CM.draft || CM.editing || CM.picking || CM.confirmClear)) { cmCancel(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('[data-cm-input]')) { e.preventDefault(); $('[data-act="cm:ok"]', e.target.closest('.cmt-edit')).click(); return; }
  if (e.key === 'Escape') { $('#deckPop').hidden = true; $('#deckOptsPop').hidden = true; $('#deckOpts').classList.remove('is-on'); if (mapOn()) { document.body.classList.remove('map-on'); render(); return; } if (pinned != null) { pinned = null; applyPin(); } if (S.menu != null) { S.menu = null; render(); } return; }

  if (mapOn()) {
    if (e.shiftKey && e.code === 'Digit1') { e.preventDefault(); mapFit(); return; }
    if (e.shiftKey && e.code === 'Digit0') { e.preventDefault(); mapReal(); return; }

    if (['-', '_'].includes(e.key) || e.code === 'NumpadSubtract') { e.preventDefault(); mapStep(-1); return; }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {

    const i = all.findIndex(([a, b]) => a === S.step && b === S.state);
    const j = Math.min(all.length - 1, Math.max(0, i + (e.key === 'ArrowRight' ? 1 : -1)));

});
/* Самопроверка: protoCheck() в консоли → { ok, checked, problems, warnings }.
   Открывает каждое состояние напрямую (как по ссылке): шаги × состояния × переключатели × обе темы. */
function protoCheck() {
  const app = $('#app'), view = $('#view'), body = document.body;
  const keep = { V, S: clone(S), dark: app.classList.contains('kbq-dark'), map: body.classList.contains('map-on'), panel: panelOf(), pinned };
  const problems = new Map(), warnings = new Map();
  const add = (map, msg, where) => { if (!map.has(msg)) map.set(msg, []); if (where) map.get(msg).push(where); };
  const P = (m, w) => add(problems, m, w), W = (m, w) => add(warnings, m, w);
  const vat = () => multi() ? `вариант ${V.key}` : undefined;  // где: текущий вариант
  const setTheme = (dark) => { app.classList.toggle('kbq-dark', dark); app.classList.toggle('kbq-light', !dark); };
  const COLOR = /:[^;{}]*?(#[0-9a-f]{3,8}\b|\brgba?\(|\bhsla?\()/gi;
  const combos = SWITCHES.reduce((acc, sw) => acc.flatMap(c => sw.options.map(o => ({ ...c, [sw.id]: o }))), [{}]).slice(0, 64);
  const seen = new Set(), renders = [], starts = [], errs = [], origErr = console.error;
  const wide = innerWidth >= 1400;
  const swKey = (sw, skip) => Object.entries(sw).filter(([k]) => k !== skip).map(e => e.join('=')).join('&');
  let checked = 0;

  /* статика: оболочка, варианты, исходник блока PROTOTYPE */
  if ($$('.deck > *').length !== 11 || $('#deckTitle').children.length) P('в шапке лишние элементы — там только заголовок и кнопки оболочки');
  if ($$('.stage > *').length !== 3) P('в .stage лишние элементы — оболочку не трогаем');
  if (typeof VARIANTS !== 'undefined') {
    if (VARIANTS.length === 1) W('в VARIANTS один вариант — выбора не будет: нужно 2–5 вариантов или ни одного');
    if (VARIANTS.length > 5) W(`вариантов ${VARIANTS.length} — сравнивать больше 5 трудно, оставь 2–3 самых разных`);
    if (multi()) VS.forEach((v, i) => {
      if (!/^[\w-]+$/.test(v.id)) P(`VARIANTS[${i}]: id «${v.id}» — нужен короткий латинский id (буквы, цифры, -, _)`);
      else if (VS.findIndex(x => x.id === v.id) !== i) P(`повторяется id варианта «${v.id}»`);
      if (!v.title) W(`вариант ${v.key} без title — в шапке будет только буква`);
      if (!v.text) W(`вариант ${v.key} без text — в панели пояснений не сказано, в чём его идея`);
    });
  }
  const DEMO = ['Опасность вместо приоритета', 'Критичность вместо приоритета', 'Условие — отдельное моно-поле'];
  if (PROTO.title !== 'Правила корреляции' && VS.some(v => v.NOTES.some(n => DEMO.includes(n.title)))) P('остались демо-пояснения шаблона');
  if (typeof CJM !== 'undefined') W('CJM больше не нужен — удали его: карта экранов строится сама из STEPS и переходов');
  const src = [...document.scripts].map(s => s.textContent).join('\n').split('RUNTIME — ниже')[0];
  if (/Date\.now\(|new Date\(\s*\)|Math\.random\(/.test(src)) W('Date.now() / new Date() / Math.random() — экраны должны быть детерминированными');
  if (/\bS\.(step|state)\s*=[^=]/.test(src)) W('S.step/S.state меняются напрямую — переходы только через goto()');
  const css5 = ($('style')?.textContent.split('5. PROTOTYPE STYLES')[1] || '').replace(/\/\*[\s\S]*?\*\//g, '');
  const hard = css5.match(COLOR);
  if (hard) P(`жёсткие цвета в разделе 5 стилей (${hard.slice(0, 3).map(s => s.replace(/^:\s*/, '').trim()).join(', ')}) — нужны var(--kbq-*)`);
  if (!wide) W(`окно ${innerWidth}px — горизонтальный скролл проверяется от 1400px`);

  console.error = (...a) => { errs.push(a.map(String).join(' ')); origErr.apply(console, a); };
  body.classList.remove('map-on'); cmCancel(); setPanel('notes', false); pinned = null;
  try {
    nav.mode = 'off';  // сотни экранов проверки не попадают в историю
    for (const v of VS) {
      V = v;  // напрямую, а не useVariant: проверка не трогает «последний экран» варианта
      /* статика варианта: данные */
      V.STEPS.forEach(st => { if (!V.VIEWS[st.id]) P(`нет VIEWS.${st.id}`, vat()); });
      const ids = V.NOTES.map(n => n.id);
      ids.forEach((id, i) => { if (ids.indexOf(id) !== i) P(`повторяется id заметки ${id}`, vat()); });
      V.NOTES.forEach(n => { if (n.step && !stateOf(n.step, n.state || stepOf(n.step)?.states[0].id)) P(`заметка ${n.id}: нет шага/состояния ${n.step}/${n.state ?? ''}`, vat()); });
      if (V.NOTES.length < 3 || V.NOTES.length > 7) W(`пояснений ${V.NOTES.length}, ожидается 3–7`, vat());
      V.LINKS.forEach((l, i) => [l.from, l.to].forEach(k => { const [a, b] = String(k ?? '').split('/'); if (!stateOf(a, b)) P(`LINKS[${i}]: нет состояния «${k}» — нужно 'шаг/состояние'`, vat()); }));
      Object.entries(V.ACTIONS).forEach(([name, fn]) => gotoCalls(fn).forEach(([a, b]) => {
        const st = LIT.exec(a)?.[2], ss = LIT.exec(b || '')?.[2];
        if (st && !stepOf(st)) P(`ACTIONS['${name}']: goto в несуществующий шаг «${st}»`, vat());
        else if (st && ss && !stateOf(st, ss)) P(`ACTIONS['${name}']: goto в несуществующее состояние «${st}/${ss}»`, vat());
      }));

      for (const dark of [false, true]) {
        setTheme(dark);
        combos.forEach((sw, ci) => V.STEPS.forEach(st => st.states.forEach(ss => {
          const where = [multi() ? V.key : '', `${st.id}/${ss.id}`, ...Object.entries(sw).map(([k, x]) => `${k}=${x}`), dark ? 'dark' : ''].filter(Boolean).join(' ');
          errs.length = 0;
          try { openState(st.id, ss.id, sw); } catch (e) { P(`ошибка отрисовки: ${e.message}`, where); return; }
          checked++;
          errs.forEach(m => P(`console.error: ${m}`, where));
          const text = view.textContent;
          if (!text.trim()) P('пустой экран', where);
          if (/lorem|ipsum|dolor sit|\bTODO\b|\bTBD\b/i.test(text)) P('текст-заглушка вместо реалистичных данных', where);
          if ($('#view .note, #view .notes')) P('пояснения внутри приложения — им место в панели справа', where);
          if (wide && document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) P('горизонтальный скролл страницы', where);
          if ([app, view].some(el => el.scrollWidth > el.clientWidth + 1)) P('содержимое шире рамки браузера и обрезано', where);
          $$('#view .k-topbar').forEach(el => { if (el.scrollWidth > el.clientWidth + 1) P('шапка экрана (k-topbar) не помещается по ширине', where); });
          $$('#view .marker').forEach(m => {
            const id = Number(m.dataset.note); seen.add(`${V.id}|${id}`);
            if (!V.NOTES.some(n => n.id === id)) P(`маркер ${id} без заметки в NOTES`, where);
            if (!m.closest(`[data-anchor="note-${id}"]`)) P(`маркер ${id} не внутри элемента с data-anchor="note-${id}" (оберни в <span class="k-anchor changed" data-anchor>)`, where);
          });
          $$('#view [data-anchor]').forEach(el => { if (!el.querySelector(`.marker[data-note="${el.dataset.anchor.replace('note-', '')}"]`)) W(`${el.dataset.anchor}: элемент без маркера внутри`, where); });
          $$('#view [data-act]').forEach(el => {
            const act = el.dataset.act;
            if (act === 'goto') { const [a, b] = (el.dataset.goto || '').split('/'); if (!stepOf(a) || (b && !stateOf(a, b))) P(`data-goto="${el.dataset.goto}" — нет такого шага/состояния`, where); }
            else if (act === 'menu') { if (!el.dataset.menu) P('data-act="menu" без data-menu', where); }
            else if (act === 'set') { if (!el.dataset.field) P('data-act="set" без data-field', where); }
            else if (act !== 'close' && !V.ACTIONS[act] && !/^(deck|note|toast):/.test(act)) P(`data-act="${act}" нет в ACTIONS`, where);
          });
          $$('#view [data-live]').forEach(el => { const a = el.dataset.live; if (a && !V.ACTIONS[a]) P(`data-live="${a}" нет в ACTIONS`, where); if (!el.dataset.model) P('data-live без data-model', where); });
          $$('#view [style]').forEach(el => { if (`:${el.getAttribute('style')}`.match(COLOR)) P('жёсткий цвет в style="…" — нужны var(--kbq-*)', where); });
          if (!dark) {
            const html = view.innerHTML;
            renders.push({ v: V.id, sw, step: st.id, state: ss.id, html });
            if (ci === 0) { render(); if (view.innerHTML !== html) W('экран меняется при повторной отрисовке — случайные данные?', where); }
          }
        })));
      }
      /* состояния, которые ничего не меняют */
      const mine = renders.filter(r => r.v === V.id);
      V.STEPS.forEach(st => st.states.forEach((a, i) => st.states.slice(i + 1).forEach(b => {
        const same = mine.filter(r => r.step === st.id && r.state === a.id).every(r => mine.find(x => x.step === st.id && x.state === b.id && swKey(x.sw) === swKey(r.sw))?.html === r.html);
        if (same) W(`«${st.title}»: состояния «${a.title}» и «${b.title}» выглядят одинаково`, vat());
      })));
      /* заметки: показаны и находятся там, куда ведут step/state */
      setTheme(false);
      V.NOTES.forEach(n => {
        if (!seen.has(`${V.id}|${n.id}`)) return P(`заметка ${n.id} «${n.title}» ни разу не показана маркером`, vat());
        if (!n.step || !stepOf(n.step)) return;
        openState(n.step, n.state, V.S_INIT.sw);
        if (!targetsOf(n.id).length) W(`заметка ${n.id}: в ${n.step}/${n.state ?? ''} при исходных переключателях маркера нет — клик по заметке его не найдёт`, vat());
      });
      /* карта экранов: шаг, в который нельзя попасть и из которого нельзя уйти, — потерян переход (кнопка без goto) или он лишний */
      if (V.STEPS.length > 1) {
        resetS(V.S_INIT);
        const linked = new Set();
        mapNodes().forEach(x => x.exits.forEach(e => { const to = e.to.split('/')[0]; if (to !== x.step) linked.add(x.step).add(to); }));
        V.STEPS.forEach(st => { if (!linked.has(st.id)) W(`карта экранов: шаг «${st.title}» не связан переходами с другими — нужна кнопка с goto() или запись в LINKS`, vat()); });
      }

      renders.forEach(r => { const k = `${r.v}|${r.step}/${r.state}|${swKey(r.sw, sw.id)}`; if (!groups.has(k)) groups.set(k, new Set()); groups.get(k).add(r.html); });
      if ([...groups.values()].every(g => g.size < 2)) W(`переключатель «${sw.title}» ничего не меняет на экранах`);
    });

    starts.forEach((a, i) => starts.slice(i + 1).forEach(b => {
      if (skeleton(a.html) === skeleton(b.html)) W(`варианты ${a.v.key} и ${b.v.key}: стартовые экраны устроены одинаково (отличается только текст) — варианты должны отличаться структурой`);
    }));
  } finally {
    console.error = origErr;
    V = keep.V; resetS(keep.S); setTheme(keep.dark);

  }

  const res = { ok: !problems.size, checked, problems: list(problems), warnings: list(warnings) };

}

window.addEventListener('popstate', (e) => {
  const h = readHash(), saved = e.state?.S, sv = e.state?.v != null ? variantOf(e.state.v) : h?.v;
  navAs('replace', () => {
    if (saved && sv && stateOf(saved.step, saved.state, sv)) { nav.i = e.state.i; useVariant(sv); resetS({ ...V.S_INIT, ...saved, menu: null }); render(); }
    else if (h) { nav.top = ++nav.i; useVariant(h.v); openState(h.step, h.state, h.sw); }  // хеш ввели руками — браузер уже добавил запись
  });
});
window.addEventListener('resize', () => { if (mapOn()) drawEdges(); cmMove(); });
$('#map').addEventListener('mouseover', mapHover);
{
  const map = $('#map');
  map.addEventListener('pointerdown', (e) => {
    mapNoClick = false;
    if (e.button !== 0 || e.target.closest('.map__zoom')) return;

  addEventListener('pointermove', (e) => {
    if (!mapPan) return;
    const dx = e.clientX - mapPan.x, dy = e.clientY - mapPan.y;
    if (!mapPan.moved && Math.hypot(dx, dy) < 4) return;  // меньше — это клик
    if (!mapPan.moved) { mapPan.moved = true; map.classList.add('is-panning'); }
    MAPV.x = mapPan.mx + dx; MAPV.y = mapPan.my + dy; mapApply();
  });
  const endPan = () => { if (mapPan?.moved) { mapNoClick = true; map.classList.remove('is-panning'); } mapPan = null; };
  addEventListener('pointerup', endPan); addEventListener('pointercancel', endPan);
  map.addEventListener('click', (e) => { if (mapNoClick) { mapNoClick = false; e.stopPropagation(); e.preventDefault(); } }, true);  // отпускание после перетаскивания — не клик
  map.addEventListener('dragstart', (e) => e.preventDefault());
  map.addEventListener('wheel', (e) => {
    if (!mapOn() || e.target.closest('.map__zoom')) return;
    e.preventDefault();
    const k = e.deltaMode === 1 ? 16 : 1, b = map.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) mapZoom(MAPV.z * Math.exp(-e.deltaY * k * 0.01), e.clientX - b.left, e.clientY - b.top);
    else { MAPV.x -= e.deltaX * k; MAPV.y -= e.deltaY * k; mapApply(); }

}
$('#map').addEventListener('mouseleave', mapHover);

(function init() {
  const panel = load('proto.panel'); if (panel) setPanel(PANELS.includes(panel) ? panel : null, false);
  if (load('proto.theme') === 'dark') $('#app').classList.replace('kbq-light', 'kbq-dark');
  nav.i = history.state?.i ?? 0;
  nav.top = Math.max(nav.i, history.state ? +(() => { try { return sessionStorage.getItem(NAV_KEY); } catch (e) {} })() || 0 : 0);
  const h = readHash(); if (h) V = h.v;
  navAs('replace', () => openState(h?.step ?? V.S_INIT.step, h?.state ?? V.S_INIT.state, h?.sw));
})();
