<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Description Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --recipeColor: #6366f1;
      --recipeColorBg: rgba(99, 102, 241, 0.15);
      --linkColor: #0072F5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f3f4f6;
        --recipeColorBg: rgba(99, 102, 241, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }
    html, body, body.inline-embedded {
      height: auto;
      min-height: 0;
    }
    body.inline-embedded {
      background: transparent;
    }
    #editor {
      min-height: calc(100vh - 16px);
      padding: 16px;
      outline: none;
      line-height: 1.5;
      font-size: 16px;
      font-family: "Martian Grotesk Nr Lt", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body.inline-embedded #editor {
      min-height: 0;
      padding: 0;
    }
    #editor p { margin: 0 0 0.5em; }
    #editor h1 { font-size: 1.1em; margin: 0 0 0.5em; font-weight: 600; }
    #editor a {
      color: var(--linkColor);
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--linkColor) 50%, transparent);
      text-underline-offset: 4px;
      text-decoration-thickness: 0.5px;
    }
    #editor mark { background: #fef08a; color: inherit; }

    /* Ordered list: circle step numbers */
    #editor ol {
      list-style: none;
      margin: 0 0 0.5em;
      padding-left: 0;
      counter-reset: tiptap-step;
    }
    #editor ol > li {
      position: relative;
      margin: 0.75rem 0;
      padding-left: 1.9375rem;
      counter-increment: tiptap-step;
    }
    #editor ol > li::before {
      content: counter(tiptap-step);
      position: absolute;
      left: 0;
      top: 0.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.375rem;
      height: 1.375rem;
      border-radius: 9999px;
      border: 0.75px solid color-mix(in srgb, var(--recipeColor) 32%, transparent);
      background: color-mix(in srgb, var(--recipeColorBg) 85%, white 15%);
      color: var(--recipeColor);
      font-family: var(--font-sans-medium, "Martian Grotesk Nr Md", sans-serif);
      font-size: 0.875rem;
      line-height: 1;
    }

    /* Bullet list: dash */
    #editor ul {
      list-style: none;
      margin: 0 0 0.5em;
      padding-left: 0;
    }
    #editor ul > li {
      position: relative;
      padding-left: 1rem;
    }
    #editor ul > li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--recipeColor);
    }

    /* Timer & ingredient references */
    #editor .timer-reference,
    #editor .ingredient-reference {
      background: color-mix(in srgb, var(--recipeColor) 12%, transparent);
      border-radius: 4px;
      padding: 0 2px;
      color: var(--recipeColor);
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body class="inline-embedded">
  <div id="editor" class="tiptap-description" contenteditable="true" spellcheck="true"></div>
  <script src="yjs.bundle.js"></script>
  <script src="description-editor-bridge.js"></script>
</body>
</html>
