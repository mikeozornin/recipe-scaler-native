<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Description Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --accent: #6366f1;
      --toolbar-bg: #f3f4f6;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --toolbar-bg: #1f2937;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--toolbar-bg);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    #toolbar button {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 8px;
      min-width: 40px;
      height: 36px;
      font-size: 15px;
      font-weight: 600;
    }
    #toolbar button.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    #editor {
      min-height: calc(100vh - 58px);
      padding: 16px;
      outline: none;
      line-height: 1.5;
      font-size: 17px;
    }
    #editor p { margin: 0 0 0.5em; }
    #editor ul, #editor ol { margin: 0 0 0.5em; padding-left: 1.2em; }
    #editor h1 { font-size: 1.1em; margin: 0 0 0.5em; }
    #editor a { color: var(--accent); }
    #editor .timer-reference,
    #editor .ingredient-reference {
      background: rgba(99, 102, 241, 0.12);
      border-radius: 4px;
      padding: 0 2px;
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      padding: 0 12px 8px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
    <button type="button" data-cmd="h1" title="Heading">H1</button>
    <button type="button" data-cmd="bullet" title="Bullet list">•</button>
  </div>
  <div id="status">Loading…</div>
  <div id="editor" class="tiptap-description" contenteditable="true" spellcheck="true"></div>
  <script src="yjs.bundle.js"></script>
  <script src="description-editor-bridge.js"></script>
</body>
</html>
