# Реестр iOS-релизов в App Store.
#
# Заполняется автоматически: bash scripts/mark-ios-release.sh <version> [--commit <sha>]
# `version` — то, что видит пользователь (CFBundleShortVersionString, например 1.0.8);
# `commit` — SHA коммита-якоря (обычно commit с bump build number);
# `notes` — опциональный финальный текст What's New из App Store Connect (для истории).
#
# Формат версий: X.Y.Z. Порядок записей не нормируется; скрипты ищут по полю version.
# Block sequence (не `[]`): скрипт дописывает записи аппендом, flow-стиль дал бы битый YAML.
releases:


  - version: "1.0.8"
    tag: ios/1.0.8
    commit: 04cd445
    date: "2026-08-27"
    notes: ""

  - version: "1.0.9"
    tag: ios/1.0.9
    commit: af451c9
    date: "2026-08-30"
    notes: |
      New:
      Recipe Scaler is now a social network too: follow friends and stay up to date on their new recipes.
      
      Fixes:
      Fixed recipe text editing
      Lots of minor bug fixes


  - version: "1.0.10"
    tag: ios/1.0.10
    commit: 1163ad1
    date: "2026-09-23"
    notes: |
      Recipe Scaler стал соцсетью: можно подписаться на автора в Discover и читать ленту его новых рецептов. О публикациях можно получать уведомления.
      
      Режим готовки без рук: когда ваши руки в тесте, вы можете прокручивать рецепт вверх и вниз голосом или жестами.
      
      По списку покупок можно собрать корзину во Вкусвилле в один клик. Вам останется только оформить заказ.
      
      Прочие небольшие улучшения.


  - version: "1.0.11"
    tag: ios/1.0.11
    commit: c446070
    date: "2026-10-02"
    notes: |
      Recipe Scaler теперь работает на Apple Watch. На часах можно смотреть все запущенные таймеры, не надо будет тянуться к телефону. Вж-вж-вж, — скажут часы, когда таймер закончится.
      
      Встряхните телефон, чтобы открыть ассистента.

